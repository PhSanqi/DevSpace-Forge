name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # test.ps1 runs the root suites, including the privacy audit that reads
          # the real PR head (HEAD^2) of GitHub's synthetic merge ref.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runtime-src/pnpm-lock.yaml
      - name: Cache verified video sidecar archive
        uses: actions/cache@v4
        with:
          path: dist/.offline-cache/video
          key: video-sidecar-${{ runner.os }}-n8.1.3-16-ge0a878dd70-20261009
      # The installed-package smoke test runs a cold `npm install` of the packed
      # tarball (~6-7 min on Windows). Caching npm's download cache keeps the
      # real install/resolve path while skipping repeated registry downloads.
      # Ask npm for its cache dir: Windows runner images relocate it, so a
      # hard-coded ~/AppData path was never saved there.
      - name: Resolve npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Cache npm download cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-cache-${{ runner.os }}-${{ hashFiles('runtime-src/package.json', 'runtime-src/pnpm-lock.yaml') }}
          restore-keys: npm-cache-${{ runner.os }}-
      - name: Install embedded Runtime dependencies
        working-directory: runtime-src
        run: pnpm install --frozen-lockfile
      - name: Typecheck embedded Runtime
        working-directory: runtime-src
        run: pnpm typecheck
      - name: Test embedded Runtime
        working-directory: runtime-src
        run: pnpm test
      - name: Test Windows control configuration
        if: runner.os == 'Windows'
        shell: powershell
        run: .\test.ps1 -SkipRuntimeSmoke
      - name: Test installed Runtime package
        working-directory: runtime-src
        run: pnpm test:package-install
      - name: Build embedded Runtime
        working-directory: runtime-src
        run: pnpm build
      - name: Validate Linux video sidecar assembly
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/video-sidecar-ci
          node ops/prepare-video-sidecar.mjs \
            --platform linux-x64 \
            --target dist/video-sidecar-ci \
            --cache dist/.offline-cache/video
      - name: Validate Windows offline Runtime assembly
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist\ci-runtime-package | Out-Null
          Push-Location runtime-src
          try {
            pnpm pack --pack-destination ..\dist\ci-runtime-package
            if ($LASTEXITCODE -ne 0) { throw 'Failed to pack canonical Runtime for Windows offline validation.' }
          }
          finally {
            Pop-Location
          }
          $runtimePackage = (Get-ChildItem dist\ci-runtime-package\*.tgz | Select-Object -First 1).FullName
          if ([string]::IsNullOrWhiteSpace($runtimePackage)) { throw 'Canonical Runtime package was not produced.' }
          .\prepare-offline-windows-runtime.ps1 `
            -OutputRoot dist\ci-offline-windows-runtime `
            -RuntimePackagePath $runtimePackage `
            -Force

  # Builds the same Windows product ZIP as the tag release, but only as a
  # short-lived Actions artifact, so unreleased PR heads can be tested on a
  # real machine (native Setup update A -> B -> A) without publishing.
  windows-package:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # test.ps1's privacy audit reads the real PR head (HEAD^2).
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runtime-src/pnpm-lock.yaml
      - name: Cache verified video sidecar archive
        uses: actions/cache@v4
        with:
          path: dist/.offline-cache/video
          key: video-sidecar-${{ runner.os }}-n8.1.3-16-ge0a878dd70-20261009
      - name: Install, build and pack canonical Runtime
        working-directory: runtime-src
        shell: powershell
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ..\dist\runtime-package | Out-Null
          pnpm pack --pack-destination ..\dist\runtime-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Windows runtime payload
        shell: powershell
        run: |
          $runtimePackage = (Get-ChildItem dist\runtime-package\*.tgz | Select-Object -First 1).FullName
          if ([string]::IsNullOrWhiteSpace($runtimePackage)) { throw 'Canonical runtime package was not produced.' }
          .\prepare-offline-windows-runtime.ps1 -OutputRoot dist\offline-windows-runtime -RuntimePackagePath $runtimePackage -Force
          $slot = (Get-Content -Raw dist\offline-windows-runtime\runtime\active-slot.txt).Trim()
          $package = "dist\offline-windows-runtime\runtime\slots\$slot\devspace\node_modules\@waishnav\devspace"
          & node .\ops\write-provenance.mjs --source-root runtime-src --server-file "$package\dist\server.js" --package-file runtime-src\package.json --output "$package\runtime-provenance.json" --artifact-id "runtime-ci-${{ github.event.pull_request.head.sha }}" --strict
          if ($LASTEXITCODE -ne 0) { throw 'Runtime provenance generation failed.' }
          New-Item -ItemType Directory -Force dist\runtime-payload | Out-Null
          tar.exe -cf dist\runtime-payload\DevSpaceControlRuntime-windows-beta4-local15.tar -C dist\offline-windows-runtime runtime cloudflared.exe
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create Windows runtime payload.' }
      - name: Build Windows product package
        shell: powershell
        run: |
          .\package-release-windows-payload.ps1 -Version '0.6.15-ci.${{ github.run_number }}' -RuntimePayloadPath dist\runtime-payload\DevSpaceControlRuntime-windows-beta4-local15.tar
      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-pr${{ github.event.pull_request.number }}-${{ github.run_number }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/DevSpace-Forge-v0.6.15-ci.${{ github.run_number }}-win-x64.zip
            dist/DevSpace-Forge-v0.6.15-ci.${{ github.run_number }}-win-x64.zip.sha256.txt

  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request checks run on GitHub's synthetic merge ref. Fetch one
          # extra generation so the privacy audit can inspect the real PR head.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install control UI dependencies
        run: npm --prefix control-ui ci
      - name: Typecheck and build control UI
        run: |
          npm --prefix control-ui run typecheck
          npm --prefix control-ui run build
      - name: Install desktop shell dependencies
        run: npm --prefix desktop-shell ci
      - name: Typecheck desktop shell
        run: npm --prefix desktop-shell run typecheck
      - name: Validate control, public site and privacy guard
        run: npm test
