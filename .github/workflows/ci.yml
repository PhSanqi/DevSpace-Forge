name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runtime-src/pnpm-lock.yaml
      - name: Install embedded Runtime dependencies
        working-directory: runtime-src
        run: pnpm install --frozen-lockfile
      - name: Typecheck embedded Runtime
        working-directory: runtime-src
        run: pnpm typecheck
      - name: Test embedded Runtime
        working-directory: runtime-src
        run: pnpm test
      - name: Test installed Runtime package
        working-directory: runtime-src
        run: pnpm test:package-install
      - name: Build embedded Runtime
        working-directory: runtime-src
        run: pnpm build

  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate control, public site and privacy guard
        run: node --test tests/runtime-console.test.mjs tests/public-site.test.mjs tests/public-repository-audit.test.mjs
