name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runtime-src/pnpm-lock.yaml
      - name: Cache verified video sidecar archive
        uses: actions/cache@v4
        with:
          path: dist/.offline-cache/video
          key: video-sidecar-${{ runner.os }}-n8.1.3-16-ge0a878dd70-20261009
      - name: Install embedded Runtime dependencies
        working-directory: runtime-src
        run: pnpm install --frozen-lockfile
      - name: Typecheck embedded Runtime
        working-directory: runtime-src
        run: pnpm typecheck
      - name: Test embedded Runtime
        working-directory: runtime-src
        run: pnpm test
      - name: Test installed Runtime package
        working-directory: runtime-src
        run: pnpm test:package-install
      - name: Build embedded Runtime
        working-directory: runtime-src
        run: pnpm build
      - name: Validate Linux video sidecar assembly
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/video-sidecar-ci
          node ops/prepare-video-sidecar.mjs \
            --platform linux-x64 \
            --target dist/video-sidecar-ci \
            --cache dist/.offline-cache/video
      - name: Validate Windows offline Runtime assembly
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist\ci-runtime-package | Out-Null
          Push-Location runtime-src
          try {
            pnpm pack --pack-destination ..\dist\ci-runtime-package
            if ($LASTEXITCODE -ne 0) { throw 'Failed to pack canonical Runtime for Windows offline validation.' }
          }
          finally {
            Pop-Location
          }
          $runtimePackage = (Get-ChildItem dist\ci-runtime-package\*.tgz | Select-Object -First 1).FullName
          if ([string]::IsNullOrWhiteSpace($runtimePackage)) { throw 'Canonical Runtime package was not produced.' }
          .\prepare-offline-windows-runtime.ps1 `
            -OutputRoot dist\ci-offline-windows-runtime `
            -RuntimePackagePath $runtimePackage `
            -Force

  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate control, public site and privacy guard
        run: node --test tests/runtime-console.test.mjs tests/public-site.test.mjs tests/public-repository-audit.test.mjs tests/video-sidecar-source.test.mjs
