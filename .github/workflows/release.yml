name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare full offline Windows runtime
        shell: powershell
        run: .\prepare-offline-windows-runtime.ps1 -OutputRoot dist\offline-windows-runtime

      - name: Validate Windows release inputs
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\package-release.ps1 -Version $version -RuntimeBundleRoot dist\offline-windows-runtime -Phase Validate

      - name: Stage Windows release package
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\package-release.ps1 -Version $version -RuntimeBundleRoot dist\offline-windows-runtime -Phase Stage

      - name: Archive Windows release package
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\package-release.ps1 -Version $version -RuntimeBundleRoot dist\offline-windows-runtime -Phase Archive

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/DevSpaceControlPlatform-${{ github.ref_name }}-win-x64.zip
            dist/DevSpaceControlPlatform-${{ github.ref_name }}-win-x64.zip.sha256.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control platform
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout Linux runtime
        uses: actions/checkout@v4
        with:
          ref: linux/context-intelligence
          path: linux-runtime

      - name: Setup pnpm and Node
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: linux-runtime/pnpm-lock.yaml

      - name: Build validated Linux runtime package
        working-directory: linux-runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          mkdir -p ../control/dist/linux-runtime
          pnpm pack --pack-destination ../control/dist/linux-runtime

      - name: Build Linux release package
        working-directory: control
        run: |
          version="${GITHUB_REF_NAME#v}"
          runtime_package="$(find dist/linux-runtime -maxdepth 1 -type f -name '*.tgz' | head -n 1)"
          test -n "$runtime_package"
          bash ./package-release-linux.sh "$version" "$runtime_package"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          compression-level: 0
          if-no-files-found: error
          path: |
            control/dist/DevSpaceControlPlatform-${{ github.ref_name }}-linux-x64.tar.gz
            control/dist/DevSpaceControlPlatform-${{ github.ref_name }}-linux-x64.tar.gz.sha256.txt

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            dist/DevSpaceControlPlatform-${{ github.ref_name }}-win-x64.zip
            dist/DevSpaceControlPlatform-${{ github.ref_name }}-win-x64.zip.sha256.txt
            dist/DevSpaceControlPlatform-${{ github.ref_name }}-linux-x64.tar.gz
            dist/DevSpaceControlPlatform-${{ github.ref_name }}-linux-x64.tar.gz.sha256.txt
          )
          if gh release view '${{ github.ref_name }}' >/dev/null 2>&1; then
            gh release upload '${{ github.ref_name }}' "${files[@]}" --clobber
          else
            gh release create '${{ github.ref_name }}' "${files[@]}" \
              --title '${{ github.ref_name }}' \
              --generate-notes
          fi
